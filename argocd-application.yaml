---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-vms
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/EXAMPLE/virt-gitops.git  # change me
    targetRevision: HEAD
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: berto-virt-gitops-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
