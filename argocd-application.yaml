---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: berto-gitops-virt-demo
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/hybridpollo/virt-gitops-workshop.git
    targetRevision: HEAD
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: berto-virt-gitops-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
